<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikanos Systems</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --accent: #2b2b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #e5e5e5;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  main {
    max-width: 480px;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 0.75rem;
    color: var(--accent);
  }
  p {
    font-size: 1rem;
    color: var(--muted);
    margin: 0 0 1.5rem;
    line-height: 1.5;
  }
  a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  a:hover {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Ikanos Systems LLC</h1>
  <p>Site coming soon.</p>
  <p><a href="mailto:hello@ikanossystems.ai">hello@ikanossystems.ai</a></p>
</main>
</body>
</html>
